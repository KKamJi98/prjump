[package]
name = "prjump"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Open GitHub/Bitbucket Cloud pull request pages from the CLI"
license = "MIT"
authors = ["kkamji <rlaxowl5460@gmail.com>"]
repository = "https://github.com/KKamJi98/prjump"
homepage = "https://github.com/KKamJi98/prjump"
readme = "README.md"
keywords = ["git", "github", "bitbucket", "pull-request", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate to what `cargo install` needs to build and test.
include = ["/src", "/tests", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[[bin]]
name = "prj"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
webbrowser = "1.2.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
