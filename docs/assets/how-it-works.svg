<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc">
  <title id="title">From a Git branch to a new pull request</title>
  <desc id="desc">prj reads Git metadata and optional config.toml host mappings. It resolves GitHub or Bitbucket Cloud, builds a URL, and opens it in a browser or prints it. Optional OSC 52 copies the URL to the terminal clipboard. It does not push or create pull requests.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52637b"/></marker>
    <style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#18283e;font-size:18px}.title{font-size:29px;font-weight:700}.head{font-size:22px;font-weight:700}.small,.label{font-size:17px;fill:#485a70}.edge{fill:none;stroke:#52637b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1040" height="660" fill="#fff"/>
  <text x="30" y="44" class="title">Your branch. The right pull request page.</text>
  <text x="30" y="74" class="small">Read Git metadata. Build a URL. No API token required.</text>

  <rect x="30" y="110" width="450" height="150" rx="12" fill="#f5f8fc" stroke="#c7d1df"/>
  <text x="50" y="145" class="head">Read inputs</text>
  <text x="50" y="179">Git: remote, current / push branch</text>
  <text x="50" y="209" class="small">Base: cached default or remote HEAD</text>
  <text x="50" y="239" class="small">Optional config.toml: host map, provider</text>

  <rect x="560" y="110" width="450" height="150" rx="12" fill="#eff6ff" stroke="#8cb6ee"/>
  <text x="580" y="145" class="head">Resolve provider</text>
  <text x="580" y="179">GitHub / GitHub Enterprise</text>
  <text x="580" y="209">Bitbucket Cloud</text>
  <text x="580" y="239" class="small">--provider overrides detection</text>
  <path d="M480 185H552" class="edge"/><text x="520" y="168" text-anchor="middle" class="label">Inputs</text>

  <path d="M785 260V290H520V322" class="edge"/>
  <text x="650" y="282" text-anchor="middle" class="label">Provider + branch refs</text>
  <rect x="300" y="330" width="440" height="110" rx="12" fill="#ecf9f4" stroke="#7cbfa6"/>
  <text x="322" y="365" class="head">Build the URL</text>
  <text x="322" y="397">Encode source + target branch names</text>
  <text x="322" y="425" class="small">Compare / new pull request page</text>

  <path d="M520 440V470H180V512" class="edge"/>
  <path d="M520 470V512" class="edge"/>
  <path d="M520 470H860V512" class="edge"/>
  <text x="192" y="502" class="label">URL</text>
  <text x="532" y="502" class="label">URL</text>
  <text x="872" y="502" class="label">URL</text>

  <rect x="30" y="520" width="300" height="100" rx="12" fill="#fff" stroke="#c7d1df"/>
  <text x="50" y="554" class="head">Browser</text>
  <text x="50" y="583" class="small">Default: open the PR form</text>
  <text x="50" y="609" class="small">You review and submit</text>
  <rect x="370" y="520" width="300" height="100" rx="12" fill="#fff" stroke="#c7d1df"/>
  <text x="390" y="554" class="head">Standard output</text>
  <text x="390" y="583" class="small">--print / headless SSH</text>
  <text x="390" y="609" class="small">URL only, no browser</text>
  <rect x="710" y="520" width="300" height="100" rx="12" fill="#fff" stroke="#c7d1df"/>
  <text x="730" y="554" class="head">Terminal clipboard</text>
  <text x="730" y="583" class="small">--copy (optional)</text>
  <text x="730" y="609" class="small">OSC 52 support required</text>
  <text x="30" y="650" class="small">Does not push commits, find existing PRs, or submit a pull request.</text>
</svg>
